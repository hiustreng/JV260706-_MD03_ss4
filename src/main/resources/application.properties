spring.application.name=BTVN_ss4

# DATABASE (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/course_management?currentSchema=public
spring.datasource.username=postgres
spring.datasource.password=123123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
# 'create' sẽ drop các bảng cũ và tạo mới toàn bộ theo đúng Entity
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.default_schema=public

# Tắt kiểm tra state generator để tương thích PostgreSQL 18
spring.jpa.properties.hibernate.id.generator.stored_state_check=false
spring.jpa.properties.hibernate.id.sequence.table=false

# In câu lệnh SQL ra console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true